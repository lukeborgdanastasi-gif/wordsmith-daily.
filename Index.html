<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wordsmith Daily</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
:root{
  --bg:#f4f2ec; --surface:#fffdf8; --ink:#1c1f1e; --muted:#5d6461;
  --accent:#2d5b57; --line:#d9d4c6; --good:#2f7a4a; --bad:#a13b2e;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15181a; --surface:#1e2326; --ink:#ece9e1; --muted:#9ba29e;
    --accent:#8fc7bf; --line:#2f3639; --good:#7fd19a; --bad:#f09a8a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15181a; --surface:#1e2326; --ink:#ece9e1; --muted:#9ba29e;
  --accent:#8fc7bf; --line:#2f3639; --good:#7fd19a; --bad:#f09a8a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:24px; padding-bottom:32px;
}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:22px;margin:0}
.date{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:28px 24px;min-width:0}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600;margin:0}
.word{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(40px,12vw,60px);line-height:1.05;margin:8px 0 4px;overflow-wrap:anywhere;letter-spacing:-.01em}
.meta{color:var(--muted);margin:0}
.pos{font-style:italic}
.def{font-size:21px;line-height:1.4;margin:16px 0 0;text-wrap:pretty}
.ex{margin:16px 0 0;padding-left:14px;border-left:2px solid var(--accent);color:var(--muted);font-style:italic;text-wrap:pretty}
.challenge{margin-top:20px;padding-top:18px;border-top:1px dashed var(--line)}
.challenge p{margin:6px 0 0}
h2{font-family:Fraunces,Georgia,serif;font-size:20px;font-weight:600;margin:0}
.gap{font-size:19px;line-height:1.5;margin:14px 0 0;text-wrap:pretty}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.btn{font:inherit;text-align:left;padding:11px 14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:4px;cursor:pointer;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{cursor:default}
.btn:focus-visible,.pill:focus-visible,.retry:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.correct{border-color:var(--good);color:var(--good);font-weight:600}
.btn.wrong{border-color:var(--bad);color:var(--bad)}
.feedback{margin:12px 0 0;min-height:1.4em;color:var(--muted)}
.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.pill{font:inherit;padding:10px 16px;border-radius:999px;border:1px solid var(--accent);background:var(--accent);color:var(--bg);cursor:pointer}
.pill.on{background:transparent;color:var(--accent)}
.count{color:var(--muted);font-variant-numeric:tabular-nums}
.retry{font:inherit;padding:10px 16px;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:4px;cursor:pointer;margin-top:12px}
.loading{color:var(--muted)}
footer{color:var(--muted);font-size:14px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="brand">Wordsmith Daily</h1>
    <span class="date" id="date"></span>
  </header>

  <section class="card" aria-live="polite">
    <p class="label">Word of the day</p>
    <p class="loading" id="loading">Finding today's word…</p>
    <div id="entry" hidden>
      <div class="word" id="word"></div>
      <p class="meta"><span class="pos" id="pos"></span> <span id="phon"></span></p>
      <p class="def" id="def"></p>
      <p class="ex" id="ex" hidden></p>
      <div class="challenge">
        <p class="label">Try it today</p>
        <p id="chal"></p>
        <label class="label" for="sentence" style="display:block;margin-top:14px">Your sentence</label>
        <textarea id="sentence" rows="3" style="width:100%;margin-top:6px;font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);resize:vertical"></textarea>
        <div class="actions" style="margin-top:10px">
          <button class="retry" id="copy" type="button" style="margin-top:0">Copy sentence</button>
          <span class="count" id="saved"></span>
        </div>
      </div>
    </div>
    <p id="error" hidden>We couldn't load today's word. Check your connection and try again.<br>
      <button class="retry" id="retry" type="button">Try again</button></p>
  </section>

  <section class="card" id="quizCard" hidden>
    <h2>Quick check</h2>
    <p class="feedback" style="margin-top:6px">Which word fits the gap?</p>
    <p class="gap" id="gap"></p>
    <div class="opts" id="opts" role="group" aria-label="Answer choices"></div>
    <p class="feedback" id="feedback"></p>
  </section>

  <section class="card actions">
    <button class="pill" id="learn" type="button">I've learned it</button>
    <span class="count" id="count"></span>
  </section>

  <footer>A new word every day. Come back tomorrow.</footer>
</div>

<script>
var WORD_LIST_URL = "https://cdn.jsdelivr.net/gh/dwyl/english-words@master/words_alpha.txt";
var API = "https://api.dictionaryapi.dev/api/v2/entries/en/";
var SEED = 20261029; /* fixed seed so every visitor gets the same shuffled order */
var DAY_MS = 86400000;

function dateKey(d){ return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function dayIndex(d){
  var a = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  var b = new Date(2026, 0, 1);
  return Math.round((a - b) / DAY_MS);
}
function rng(seed){
  var s = seed >>> 0;
  return function(){ s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}
function getItem(k){ try { return window.localStorage.getItem(k); } catch(e){ return null; } }
function setItem(k, v){ try { window.localStorage.setItem(k, v); } catch(e){} }

function learnedList(){
  var raw = getItem("wsd-learned");
  try { return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
}

/* Load the word list, keep plain lowercase words of a common-ish length, shuffle with a fixed seed */
var poolPromise = null;
function loadPool(){
  if (poolPromise) return poolPromise;
  poolPromise = fetch(WORD_LIST_URL).then(function(r){
    if (!r.ok) throw new Error("word list");
    return r.text();
  }).then(function(text){
    var lines = text.split("\n");
    var pool = [];
    for (var i = 0; i < lines.length; i++){
      var w = lines[i].trim().toLowerCase();
      if (/^[a-z]{5,10}$/.test(w)) pool.push(w);
    }
    var rand = rng(SEED);
    for (var j = pool.length - 1; j > 0; j--){
      var k = Math.floor(rand() * (j + 1));
      var t = pool[j]; pool[j] = pool[k]; pool[k] = t;
    }
    return pool;
  });
  return poolPromise;
}

/* Look up a word. Resolves to {word, phonetic, pos, def, example} or null.
   With needExample, the entry must have an example sentence that uses the word itself,
   so the quiz can blank it out. */
function lookup(word, needExample){
  return fetch(API + encodeURIComponent(word)).then(function(r){
    if (!r.ok) return null;
    return r.json();
  }).then(function(data){
    if (!data || !data.length) return null;
    var entry = data[0];
    var found = null;
    var meanings = entry.meanings || [];
    for (var m = 0; m < meanings.length && !found; m++){
      var meaning = meanings[m];
      var defs = meaning.definitions || [];
      for (var d = 0; d < defs.length && !found; d++){
        var ex = defs[d].example || "";
        if (needExample && !new RegExp("\\b" + word + "\\b", "i").test(ex)) continue;
        if (needExample && !ex) continue;
        found = {
          word: entry.word || word,
          pos: meaning.partOfSpeech || "",
          def: defs[d].definition,
          example: ex
        };
      }
    }
    if (!found) return null;
    var phon = entry.phonetic || "";
    if (!phon && entry.phonetics){
      for (var p = 0; p < entry.phonetics.length; p++){
        if (entry.phonetics[p].text){ phon = entry.phonetics[p].text; break; }
      }
    }
    found.phonetic = phon;
    return found;
  }).catch(function(){ return null; });
}

/* Find the first pool word, from a start index, that the API can define with a usable example */
function findDefined(pool, start, tries){
  var index = start;
  var attempts = 0;
  function next(){
    if (attempts >= tries) return Promise.resolve(null);
    attempts++;
    var w = pool[index % pool.length];
    index++;
    return lookup(w, true).then(function(res){
      if (res) return res;
      return next();
    });
  }
  return next();
}

/* Pick three other words with the same part of speech, so the quiz needs real context to answer */
function findDistractors(pool, start, target){
  var found = [];
  var index = start;
  var tries = 0;
  function next(){
    if (found.length >= 3 || tries >= 60) return Promise.resolve(found);
    tries++;
    var w = pool[index % pool.length];
    index += 97;
    if (w === target.word) return next();
    return lookup(w, false).then(function(res){
      if (res && res.pos === target.pos && res.word !== target.word){
        var dupe = found.some(function(f){ return f.word === res.word; });
        if (!dupe) found.push(res);
      }
      return next();
    });
  }
  return next();
}

function cap(s){ return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function end(s){ s = s.trim(); return /[.!?]$/.test(s) ? s : s + "."; }

var now = new Date();
var key = dateKey(now);
var dayIdx = dayIndex(now);

document.getElementById("date").textContent =
  now.toLocaleDateString("en-GB", {weekday:"long", day:"numeric", month:"long"});

function renderLearned(word){
  var list = learnedList();
  var learnBtn = document.getElementById("learn");
  var has = list.indexOf(word) !== -1;
  learnBtn.textContent = has ? "Learned ✓ (undo)" : "I've learned it";
  learnBtn.classList.toggle("on", has);
  document.getElementById("count").textContent =
    list.length + (list.length === 1 ? " word learned" : " words learned");
  learnBtn.onclick = function(){
    var l = learnedList();
    var at = l.indexOf(word);
    if (at === -1) l.push(word); else l.splice(at, 1);
    setItem("wsd-learned", JSON.stringify(l));
    renderLearned(word);
  };
}

/* Fill-in-the-blank quiz: today's example sentence with the word removed, and the word as one of four choices */
function showQuiz(today, distractors, answeredKey){
  var optsEl = document.getElementById("opts");
  var feedbackEl = document.getElementById("feedback");
  var gapEl = document.getElementById("gap");

  var blanked = today.example.replace(new RegExp("\\b" + today.word + "\\b", "i"), "_____");
  gapEl.textContent = "“" + cap(blanked) + "”";

  var words = [];
  for (var i = 0; i < distractors.length; i++) words.push(distractors[i].word);
  /* Put the correct word in a stable position for this day */
  var rand = rng(dayIdx * 7919 + 13);
  var pos = Math.floor(rand() * (words.length + 1));
  var options = words.slice();
  options.splice(pos, 0, today.word);
  var correctIndex = options.indexOf(today.word);

  var answered = getItem(answeredKey);
  answered = answered === null ? null : parseInt(answered, 10);

  function showResult(choice){
    var buttons = optsEl.querySelectorAll("button");
    for (var j = 0; j < buttons.length; j++){
      buttons[j].disabled = true;
      if (j === correctIndex) buttons[j].classList.add("correct");
      else if (j === choice) buttons[j].classList.add("wrong");
    }
    feedbackEl.textContent = choice === correctIndex
      ? "Correct. You've got it."
      : "Not quite. The right word is highlighted.";
  }

  optsEl.innerHTML = "";
  options.forEach(function(text, index){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "btn";
    b.textContent = text;
    b.addEventListener("click", function(){
      if (answered !== null) return;
      answered = index;
      setItem(answeredKey, String(index));
      showResult(index);
    });
    optsEl.appendChild(b);
  });
  if (answered !== null) showResult(answered);
  document.getElementById("quizCard").hidden = false;
}

function showError(){
  document.getElementById("loading").hidden = true;
  document.getElementById("entry").hidden = true;
  document.getElementById("error").hidden = false;
}

function run(){
  document.getElementById("error").hidden = true;
  document.getElementById("loading").hidden = false;
  document.getElementById("entry").hidden = true;
  document.getElementById("quizCard").hidden = true;

  var dayCacheKey = "wsd3-" + key;
  var cached = getItem(dayCacheKey);
  var cachedToday = null;
  try { cachedToday = cached ? JSON.parse(cached) : null; } catch(e){ cachedToday = null; }

  if (cachedToday){
    showToday(cachedToday);
    showQuiz(cachedToday, cachedToday.distractors || [], "wsd3-quiz-" + key);
    renderLearned(cachedToday.word);
    return;
  }

  loadPool().then(function(pool){
    var start = ((dayIdx % pool.length) + pool.length) % pool.length;
    return findDefined(pool, start, 25).then(function(today){
      if (!today) throw new Error("no definition");
      return findDistractors(pool, start + 1, today).then(function(distractors){
        if (distractors.length < 3) throw new Error("not enough distractors");
        return {today: today, distractors: distractors};
      });
    });
  }).then(function(result){
    var payload = {word: result.today.word, pos: result.today.pos, phonetic: result.today.phonetic,
                   def: result.today.def, example: result.today.example,
                   distractors: result.distractors};
    setItem(dayCacheKey, JSON.stringify(payload));
    showToday(payload);
    showQuiz(payload, result.distractors, "wsd3-quiz-" + key);
    renderLearned(payload.word);
  }).catch(function(){
    showError();
  });
}

function showToday(t){
  document.getElementById("loading").hidden = true;
  document.getElementById("entry").hidden = false;
  document.getElementById("word").textContent = t.word;
  document.getElementById("pos").textContent = t.pos;
  document.getElementById("phon").textContent = t.phonetic || "";
  document.getElementById("def").textContent = cap(end(t.def));
  var ex = document.getElementById("ex");
  if (t.example){
    ex.textContent = "“" + cap(end(t.example)) + "”";
    ex.hidden = false;
  } else {
    ex.hidden = true;
  }
  document.getElementById("chal").textContent = challengeFor(t.word);
}

/* Writing prompts: each gives the reader a real scenario to write a sentence for */
var SCENARIOS = [
  "Describe your commute using {w}.",
  "Write a one-line weather forecast that uses {w}.",
  "Text a friend a sentence with {w} in it, and see if they notice.",
  "Use {w} in a tweet-length complaint about something small.",
  "Describe what your dinner looks like tonight, using {w}.",
  "Write a film title or book blurb that includes {w}.",
  "Give a pet, a plant or a houseplant a grand title using {w}.",
  "Explain to a child what {w} means, using a sentence of your own."
];
function challengeFor(word){
  var sum = 0;
  for (var i = 0; i < word.length; i++) sum += word.charCodeAt(i);
  var pick = SCENARIOS[(sum + dayIdx) % SCENARIOS.length];
  return pick.split("{w}").join(word);
}

/* Save the reader's sentence for today, and offer a copy button */
function setupSentence(){
  var box = document.getElementById("sentence");
  var saved = document.getElementById("saved");
  var sentenceKey = "wsd-sentence-" + key;
  var stored = getItem(sentenceKey);
  box.value = stored || "";
  var timer = null;
  box.oninput = function(){
    setItem(sentenceKey, box.value);
    saved.textContent = "Saved";
    clearTimeout(timer);
    timer = setTimeout(function(){ saved.textContent = ""; }, 1200);
  };
  document.getElementById("copy").onclick = function(){
    var text = box.value;
    if (!text){ saved.textContent = "Write something first"; return; }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){
        saved.textContent = "Copied";
      }, function(){
        box.select();
        saved.textContent = "Select and copy the text above";
      });
    } else {
      box.select();
      saved.textContent = "Select and copy the text above";
    }
  };
}

document.getElementById("retry").addEventListener("click", run);
setupSentence();
run();
</script>
</body>
</html>
